name: Playwright Tests

# Cuándo se ejecuta: en cada push y pull request a main,
# y también manualmente desde la pestaña Actions.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 1. Descarga el código del repo en la máquina virtual
      - uses: actions/checkout@v4

      # 2. Instala Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Instala las dependencias del proyecto
      - name: Install dependencies
        run: npm ci

      # 4. Descarga el navegador (solo Chromium, el que usa tu config)
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # 5. Corre los tests
      - name: Run Playwright tests
        run: npx playwright test

      # 6. Guarda el reporte HTML para poder bajarlo, pase o falle
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14